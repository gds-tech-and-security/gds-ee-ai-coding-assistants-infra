name: Deploy Terraform template (IGNORE)

on:
  workflow_call:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: environment
      working_directory:
        description: "Terraform working directory"
        required: true
        type: string
      terraform-version-file:
        description: 'Path of the .terraform-version file'
        required: false
        type: string
        default: ".terraform-version"
      aws_region:
        description: "AWS region"
        required: false
        default: "eu-west-2"
        type: string
      runner_label:
        description: "Runner label to execute the job on"
        required: false
        default: "static_ip_runner"
        type: string

# NOTE: This declaration defaults all GH other permissions to none.
# - Create subsequent permissions scoped to job only after confirming with a techlead
# - Declaration here follows the policy defined in ADR-EA007
permissions:
  contents: none # Set so other permissions take the value 'none' by default
  id-token: none # Prevent OIDC token generation (‘none’ is the default)
  packages: none # Prevent package access (‘none’ is the default)

env:
  TF_IN_AUTOMATION: true
  AWS_DEFAULT_REGION: ${{ inputs.aws_region }}

  ENV: ${{ inputs.environment }}
  TF_DIR: ${{ inputs.working_directory }}

  TF_PLAN_FILE_NAME: tfplan
  TF_PLAN_FILE_PATH: ${{ github.workspace }}/tfplan

jobs:
  pre-flight:
    runs-on: ${{ inputs.runner_label }}
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    outputs:
      tf_version: ${{ steps.tf-version.outputs.tf_version }}
    steps:
      - name: Validate AWS_ROLE_ARN vars
        env:
          AWS_ROLE_ARN_PLAN: ${{ vars.aws_role_arn_plan }}
          AWS_ROLE_ARN_APPLY: ${{ vars.aws_role_arn_apply }}
        run: |
          if [ -z "$AWS_ROLE_ARN_PLAN" ] || [ -z "$AWS_ROLE_ARN_APPLY" ]; then
            echo "ERROR:"
            echo "'AWS_ROLE_ARN_PLAN' or 'AWS_ROLE_ARN_APPLY' variable is empty"
            echo "If the input specified is a deployment environment variable, verify that it is configured correctly in the repository settings"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get terraform version from '.terraform-version' file
        id: tf-version
        run: |
          tf_version_path="${{ github.workspace }}/${{ inputs.terraform-version-file }}"
          if [ ! -f "$tf_version_path" ]; then
            echo "ERROR: ${tf_version_path} file not found"
            exit 1
          fi
          echo "tf_version=$(cat "$tf_version_path")" | tee -a "$GITHUB_OUTPUT"

  pre-commit:
    needs:
      - pre-flight
    runs-on: ${{ inputs.runner_label }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install terraform and dependencies
        uses: alphagov/gds-tech-and-security-github-actions/terraform/deps@4b0a3ad58c1ea4b3ff1d5ed0a5ae6bc1c91455ec # v0.1.22
        with:
          terraform-version: "${{ needs.pre-flight.outputs.tf_version }}"

  terraform-plan:
    name: Terraform Plan
    needs:
      - pre-flight
      - pre-commit
    runs-on: ${{ inputs.runner_label }}
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write # required to request OIDC JWT
    env:
      AWS_ROLE_ARN: ${{ vars.aws_role_arn_plan }}
    outputs:
      TF_PLAN_ARTIFACT_ID: ${{ steps.artifact-tf.outputs.artifact-id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # 4.0.1
        with:
          terraform_version: "${{ needs.pre-flight.outputs.tf_version }}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          aws-region: ${{ env.AWS_DEFAULT_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}

      - name: Terraform Plan
        run: |
          make plan ARGS=' \
            -input=false \
            -out=${{ env.TF_PLAN_FILE_PATH }} \
          '

      # Generate only the necessary files to pass to the terraform-apply job
      - name: Create artifact
        run: |
          # if the tfplan path specified is not in the `github_workspace` dir copy the files here
          if [ ! -f "./${{ env.TF_PLAN_FILE_NAME }}" ]; then
            mv -v "${{ env.TF_PLAN_FILE_PATH }}" ${{ env.TF_PLAN_FILE_NAME}}
          fi

          tar \
            -czvf artifact.tar.gz \
            ${{ env.TF_PLAN_FILE_NAME }} \
            -C "${{ inputs.working_directory }}" \
              .terraform.lock.hcl \
              .terraform/providers

      - name: Upload artifact
        id: artifact-tf
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: artifact.tar.gz
          archive: false
          retention-days: 1
          if-no-files-found: "error"

  terraform-apply:
    if: github.ref_name == 'main'
    name: Terraform Apply
    needs:
      - pre-flight
      - pre-commit
      - terraform-plan
    runs-on: ${{ inputs.runner_label }}
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write # required to request OIDC JWT
    env:
      AWS_ROLE_ARN: ${{ vars.aws_role_arn_apply }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.terraform-plan.outputs.TF_PLAN_ARTIFACT_ID }}

      - name: Extract artifact
        run: |
          tar -xvf artifact.tar.gz

      - name: Check Terraform Plan artifact exists
        run: |
          if [ ! -f "${{ env.TF_PLAN_FILE_NAME }}" ]; then
            echo "'${{ env.TF_PLAN_FILE_NAME }}' terraform plan file not found"
            exit 1
          fi

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # 4.0.1
        with:
          terraform_version: "${{ needs.pre-flight.outputs.tf_version }}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          aws-region: ${{ env.AWS_DEFAULT_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}

      - name: Terraform Apply
        run: |
          make apply-approve ARGS=' \
            "${{ env.TF_PLAN_FILE_PATH }}" \
          '
